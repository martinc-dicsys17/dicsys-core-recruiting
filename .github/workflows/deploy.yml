name: Deploy Dicsys-Core

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PROJECT_DIR: ${{ vars.PROJECT_DIR }}
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  VM_NAME: ${{ vars.VM_NAME }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  REPO_FULL_NAME: ${{ vars.REPO_FULL_NAME }}

jobs:
  deploy:
    # APAGADO en feature/upgrade-tech-stack (pedido del usuario, 2026-10-15): esta rama no se despliega a producción,
    # ni por release ni a mano. Se va a probar en un ambiente de test con una copia de la base de producción (fase F23
    # del plan). Para volver a desplegar, sacar este if.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout (el script de deploy)
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP Tunnel
        env:
          CODE_TOKEN: ${{ secrets.CODE_TOKEN }}
        run: |
          # El script vive en el repo (despliegue/desplegar.sh): el mismo que usa la VM de test (D-101)
          sed -i 's/\r$//' despliegue/desplegar.sh
          # Sanitizar variables localmente tambien
          CLEAN_PROJECT_DIR=$(echo "${{ env.PROJECT_DIR }}" | tr -d '\r')
          CLEAN_REPO=$(echo "${{ env.REPO_FULL_NAME }}" | tr -d '\r')
          # sin token en la URL: el token viaja por stdin al script (F06-P05)
          REPO_URL="https://github.com/${CLEAN_REPO}.git"

          gcloud compute scp despliegue/desplegar.sh ${{ vars.VM_NAME }}:/tmp/deploy.sh \
            --project=${{ vars.GCP_PROJECT }} \
            --zone=${{ vars.VM_ZONE }} \
            --tunnel-through-iap

          printf '%s\n' "$CODE_TOKEN" | gcloud compute ssh ${{ vars.VM_NAME }} \
            --project=${{ vars.GCP_PROJECT }} \
            --zone=${{ vars.VM_ZONE }} \
            --tunnel-through-iap \
            --command="bash /tmp/deploy.sh '${CLEAN_PROJECT_DIR}' '${REPO_URL}' main"

      # ── Aviso a Webex, salga bien o mal (machete 02-GHB-06, docs/machete/) ──
      #    Copiado de 03 - Plantillas/github/deploy.yml de machete-v9; cambia
      #    solo COMPONENTE. if: always() para que tambien avise el fallo, que es
      #    cuando importa. Sin WEBEX_BOT_TOKEN o WEBEX_ROOM_DEPLOYS cargados en el
      #    environment prod el paso no hace nada y no rompe el deploy.
      - name: Notificar a Webex
        if: always()
        env:
          # Los valores que vienen de afuera (titulo y cuerpo del release) van
          # por env y nunca interpolados dentro del script: un release con
          # comillas o con $(...) no tiene que poder ejecutar nada en el runner.
          ESTADO: ${{ job.status }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          AUTOR: ${{ github.actor }}
          DISPARADOR: ${{ github.event_name }}
          COMPONENTE: dicsys-core
          NOTAS: ${{ github.event.release.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBEX_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM: ${{ vars.WEBEX_ROOM_DEPLOYS }}
        run: |
          if [ -z "$WEBEX_TOKEN" ] || [ -z "$WEBEX_ROOM" ]; then
            echo "Sin WEBEX_BOT_TOKEN o WEBEX_ROOM_DEPLOYS: no se notifica."
            exit 0
          fi

          # El estado define color e icono. Se lee antes que cualquier texto, que
          # es el punto de mandar una card y no markdown: Webex solo renderiza
          # negrita, italica, codigo y enlaces, sin cabeceras de color.
          case "$ESTADO" in
            success)   ICONO="🟢"; TITULO="Deploy OK";        ESTILO="good" ;;
            failure)   ICONO="🔴"; TITULO="Deploy FALLIDO";   ESTILO="attention" ;;
            cancelled) ICONO="⚪"; TITULO="Deploy cancelado"; ESTILO="default" ;;
            *)         ICONO="⚪"; TITULO="Deploy $ESTADO";   ESTILO="default" ;;
          esac

          # Texto de reserva: Webex lo exige junto a una card, y es lo que se ve
          # en la notificacion del celular. Por eso lleva lo esencial.
          RESERVA="$ICONO **$TITULO** · \`$REPO\` \`$TAG\` — lanzado por $AUTOR"

          # jq arma todo el JSON: escapa comillas, saltos de linea y acentos sin
          # que haya que pensar en el quoting, y --arg deja los valores externos
          # como datos y nunca como codigo.
          jq -n \
            --arg room "$WEBEX_ROOM" --arg md "$RESERVA" \
            --arg icono "$ICONO" --arg titulo "$TITULO" --arg estilo "$ESTILO" \
            --arg repo "$REPO" --arg tag "$TAG" --arg autor "$AUTOR" \
            --arg disparador "$DISPARADOR" --arg notas "$NOTAS" --arg runurl "$RUN_URL" \
            --arg componente "$COMPONENTE" '
            {
              roomId: $room,
              markdown: $md,
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  type: "AdaptiveCard",
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  version: "1.3",
                  body: ([
                    {
                      type: "Container", style: $estilo, bleed: true,
                      items: [{
                        type: "ColumnSet",
                        columns: [
                          {type: "Column", width: "auto", verticalContentAlignment: "center",
                           items: [{type: "TextBlock", text: $icono, size: "large"}]},
                          {type: "Column", width: "stretch", items: [
                            {type: "TextBlock", text: $titulo, weight: "bolder",
                             size: "medium", wrap: true},
                            {type: "TextBlock", text: $repo, spacing: "none",
                             isSubtle: true, wrap: true}
                          ]},
                          {type: "Column", width: "auto", verticalContentAlignment: "center",
                           items: [{type: "TextBlock", text: $tag, weight: "bolder"}]}
                        ]
                      }]
                    },
                    {type: "FactSet", facts: [
                      {title: "Componente",  value: $componente},
                      {title: "Lanzado por", value: $autor},
                      {title: "Disparador",  value: $disparador}
                    ]}
                  ]
                  # Una linea por cambio: un solo bloque con saltos de linea no
                  # se dibuja igual en todos los clientes de Webex. Se recortan
                  # a diez, que un changelog largo no se lee en un chat.
                  + (($notas | split("\n") | map(ltrimstr(" ") | ltrimstr("- ") | ltrimstr("* "))
                      | map(select(length > 0)) | .[0:10]) as $lineas
                     | if ($lineas | length) > 0 then [{
                         type: "Container", style: "emphasis", spacing: "medium",
                         items: ([{type: "TextBlock", text: "**Cambios**", wrap: true}]
                                 + ($lineas | map({type: "TextBlock", text: ("• " + .),
                                                   wrap: true, size: "small", spacing: "none"})))
                       }] else [] end)),
                  actions: [{type: "Action.OpenUrl", title: "Ver la corrida", url: $runurl}]
                }
              }]
            }' \
            | curl -sS -X POST https://webexapis.com/v1/messages \
                -H "Authorization: Bearer $WEBEX_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- -o /dev/null -w 'Webex respondio %{http_code}\n'
