[project]
name = "dicsys-core-frontend"
version = "0.0.0"
description = "Frontend Flask (HTMX + Alpine) de Dicsys Core"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "httpx==0.28.1",
    # Raíces TLS: 2026.10.19 saca la raíz emSign de eMudhra (claves comprometidas, octubre 2026)
    "certifi>=2026.10.19",
    "python-dotenv==1.2.4",
    "gunicorn==26.2.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false
