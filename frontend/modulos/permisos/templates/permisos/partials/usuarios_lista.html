{% for usuario in todos_usuarios %}
<label class="usuario-item flex items-center p-3 bg-dark-50 rounded-xl border border-dark-200 hover:border-primary-300 hover:bg-primary-50/30 cursor-pointer transition-all"
       x-show="shouldShowUsuario('{{ usuario.id }}')"
       x-transition>
    <input type="checkbox" 
           :value="'{{ usuario.id }}'" 
           :checked="isSelected('{{ usuario.id }}')"
           @change="toggleUsuario('{{ usuario.id }}')"
           class="w-5 h-5 text-primary-600 bg-white border-dark-300 rounded focus:ring-primary-500">
    <div class="w-10 h-10 bg-gradient-to-br from-primary-400 to-accent-purple rounded-xl flex items-center justify-center text-white font-semibold ml-3">
        {{ usuario.nombre[0]|upper }}{{ usuario.apellido[0]|upper if usuario.apellido else '' }}
    </div>
    <div class="ml-3 flex-1">
        <p class="font-medium text-dark-900">{{ usuario.nombre }} {{ usuario.apellido or '' }}</p>
        <p class="text-sm text-dark-500">{{ usuario.email }}</p>
        {% if usuario.departamento_nombre %}
        <p class="text-xs text-dark-400 mt-0.5">
            <i data-lucide="building-2" class="w-3 h-3 inline mr-1"></i>{{ usuario.departamento_nombre }}
        </p>
        {% endif %}
    </div>
    {% if usuario.activo %}
    <span class="px-2 py-1 text-xs font-medium bg-emerald-100 text-emerald-700 rounded-lg">Activo</span>
    {% else %}
    <span class="px-2 py-1 text-xs font-medium bg-dark-100 text-dark-600 rounded-lg">Inactivo</span>
    {% endif %}
</label>
{% endfor %}
{% if not todos_usuarios %}
<div class="text-center py-4 text-dark-500">
    <p>No se encontraron usuarios</p>
</div>
{% endif %}
