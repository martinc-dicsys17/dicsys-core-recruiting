{% extends "core/base.html" %}
{% block title %}Agregar Domicilio - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto animate-fade-in">

    <div class="flex items-center mb-6">
        <a href="{{ url_for('administracion.clientes_edit', id=cliente.id) }}"
           class="p-2 rounded-xl hover:bg-dark-100 mr-3 text-dark-500">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-dark-900">Agregar Domicilio</h1>
            <p class="text-dark-500 text-sm">{{ cliente.razon_social }}</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="form-error"></div>

        <form hx-post="{{ url_for('administracion.clientes_domicilio_add', id=cliente.id) }}"
              hx-target="#form-error"
              hx-indicator="#submit-spinner"
              method="POST">

            <div class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Calle *</label>
                        <input type="text" name="calle" required maxlength="200"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Número</label>
                        <input type="text" name="numero" maxlength="20"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Piso / Depto</label>
                        <div class="flex gap-2">
                            <input type="text" name="piso" maxlength="20" placeholder="Piso"
                                   class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                            <input type="text" name="departamento" maxlength="20" placeholder="Depto"
                                   class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Localidad *</label>
                        <input type="text" name="localidad" required maxlength="100"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Provincia *</label>
                        <input type="text" name="provincia" required maxlength="100"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">País</label>
                        <input type="text" name="pais" maxlength="100" value="Argentina"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Código Postal</label>
                        <input type="text" name="codigo_postal" maxlength="10"
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                    </div>
                </div>
                <p class="text-sm text-dark-400">
                    <i data-lucide="info" class="w-4 h-4 inline mr-1"></i>
                    Al agregar un nuevo domicilio, el anterior quedará como histórico.
                </p>
            </div>

            <div class="px-8 py-5 bg-dark-50 border-t border-dark-100 flex items-center justify-between">
                <a href="{{ url_for('administracion.clientes_edit', id=cliente.id) }}"
                   class="text-dark-500 hover:text-dark-700 font-medium">Cancelar</a>
                <button type="submit"
                        class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 shadow-soft font-semibold flex items-center">
                    <svg id="submit-spinner" class="htmx-indicator animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i>Guardar Domicilio
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
