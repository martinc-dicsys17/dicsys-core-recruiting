{% extends "core/base.html" %}
{% block title %}Subir PDF - Recibos de Sueldo - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto animate-fade-in">

    <!-- Header -->
    <div class="flex items-center mb-6">
        <a href="{{ url_for('administracion_recibos.recibos_list') }}"
           class="p-2 rounded-xl hover:bg-dark-100 mr-3 text-dark-500">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-dark-900">Subir PDF Masivo</h1>
            <p class="text-dark-500 text-sm">Cargá un PDF con los recibos de sueldo del período</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="form-error"></div>

        <form hx-post="{{ url_for('administracion_recibos.recibos_upload') }}"
              hx-target="#form-error"
              hx-indicator="#submit-spinner"
              hx-encoding="multipart/form-data"
              enctype="multipart/form-data"
              method="POST">

            <div class="p-8 space-y-6">
                <!-- Período -->
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Período *</label>
                    <input type="month" name="periodo" required
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                </div>

                <!-- Tipo Liquidación -->
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Tipo de Liquidación *</label>
                    <select name="tipo_liquidacion" required
                            class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                        <option value="">Seleccionar...</option>
                        <option value="Liquidación Mensual">Liquidación Mensual</option>
                        <option value="SAC">SAC</option>
                        <option value="Liquidación Final">Liquidación Final</option>
                        <option value="Especial">Especial</option>
                    </select>
                </div>

                <!-- Archivo PDF -->
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Archivo PDF *</label>
                    <input type="file" name="archivo" required accept=".pdf"
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary-50 file:text-primary-600 hover:file:bg-primary-100">
                    <p class="text-xs text-dark-400 mt-2">Solo archivos PDF. Tamaño máximo: 50 MB.</p>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-8 py-5 bg-dark-50 border-t border-dark-100 flex items-center justify-between">
                <a href="{{ url_for('administracion_recibos.recibos_list') }}" class="text-dark-500 hover:text-dark-700 font-medium">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 shadow-soft font-semibold flex items-center">
                    <svg id="submit-spinner" class="htmx-indicator animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <i data-lucide="upload" class="w-4 h-4 mr-2"></i>
                    Subir y Procesar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
