{% extends "core/base.html" %}

{% block title %}Editar Certificación - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto animate-fade-in">
    <div class="flex items-center mb-6">
        <a href="{{ url_for('innovacion.admin_list') }}" class="p-2 rounded-xl hover:bg-dark-100 mr-3 text-dark-500">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-dark-900">Editar Certificación</h1>
            <p class="text-dark-500 text-sm">Modifica la información de la certificación</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="form-error"></div>

        <form hx-post="{{ url_for('innovacion.admin_edit', id=item.id) }}"
              hx-target="#form-error" hx-indicator="#submit-spinner" method="POST">
            <div class="p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Empleado</label>
                        <input type="text" value="{{ (item.empleado_nombre or '') }}" disabled
                               class="w-full px-4 py-3 bg-dark-100 border border-dark-200 rounded-xl text-dark-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Tipo de Certificación</label>
                        <input type="text" value="{{ (item.tipo_nombre or item.tipo_certificacion or '') }}" disabled
                               class="w-full px-4 py-3 bg-dark-100 border border-dark-200 rounded-xl text-dark-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Título</label>
                    <input type="text" name="titulo" value="{{ (item.titulo or '') if item else '' }}" maxlength="200"
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Descripción</label>
                    <textarea name="descripcion" rows="3"
                              class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">{{ (item.descripcion or '') if item else '' }}</textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Estado</label>
                    <select name="estado"
                            class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                        <option value="iniciado" {{ 'selected' if item and item.estado == 'iniciado' }}>Registrado</option>
                        <option value="en_progreso" {{ 'selected' if item and item.estado == 'en_progreso' }}>En Progreso</option>
                        <option value="en_revision" {{ 'selected' if item and item.estado == 'en_revision' }}>En Revisión</option>
                        <option value="completada" {{ 'selected' if item and item.estado == 'completada' }}>Aprobado</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Fecha de Aprobación</label>
                    <input type="date" name="fecha_aprobacion" value="{{ (item.fecha_aprobacion or '') if item else '' }}"
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                </div>
                <div class="border-t border-dark-100 pt-5">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="enviar_notificacion_webex" checked
                               class="w-5 h-5 text-primary-600 bg-dark-50 border-dark-300 rounded focus:ring-primary-500">
                        <span class="text-sm font-semibold text-dark-700">Enviar notificación por Webex</span>
                    </label>
                    <p class="text-xs text-dark-400 mt-1 ml-8">Se envía al canal #Innovación solo cuando el estado queda en "Aprobado".</p>
                </div>
            </div>

            <div class="px-8 py-5 bg-dark-50 border-t border-dark-100 flex items-center justify-between">
                <a href="{{ url_for('innovacion.admin_list') }}" class="text-dark-500 hover:text-dark-700 font-medium">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 shadow-soft font-semibold flex items-center">
                    <svg id="submit-spinner" class="htmx-indicator animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i>Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
