{% extends "core/base.html" %}

{% block title %}Desafíos - Star Miles{% endblock %}

{% block content %}
<div class="animate-fade-in" x-data="desafiosFiltros()"
     x-init="$watch('viewMode', v => localStorage.setItem('starmiles_desafios_viewMode', v))">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <div>
            <h1 class="text-3xl font-bold text-dark-900 mb-1">🎯 Desafíos</h1>
            <p class="text-dark-500">Participá y ganá Star Miles</p>
        </div>
        <a href="{{ url_for('starmiles.home') }}" class="mt-4 md:mt-0 text-primary-600 hover:text-primary-700 font-medium flex items-center">
            <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>Volver
        </a>
    </div>

    <!-- Filtros -->
    <div class="bg-white rounded-2xl border border-dark-100 p-4 mb-6">
        <div class="flex flex-col lg:flex-row lg:items-center gap-4">
            <!-- Búsqueda -->
            <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-5 h-5 text-dark-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                <input type="text" placeholder="Buscar desafíos..." name="search" x-model="buscar"
                       @keyup.debounce.300ms="paginaActual = 1; aplicarFiltros()"
                       class="w-full pl-12 pr-4 py-2.5 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500">
            </div>

            <!-- Categoría -->
            <select x-model="categoriaId" @change="paginaActual = 1; aplicarFiltros()"
                    class="px-4 py-2.5 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-dark-700">
                <option value="">Todas las categorías</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>

            <!-- Área (alcance) -->
            <select x-model="alcance" @change="paginaActual = 1; aplicarFiltros()"
                    class="px-4 py-2.5 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 text-dark-700">
                <option value="">Todas las áreas</option>
                {% for a in alcances %}
                <option value="{{ a }}">{{ a }}</option>
                {% endfor %}
            </select>

            <!-- Ordenar por -->
            <div class="relative" x-data="{ openOrdenar: false }">
                <button @click="openOrdenar = !openOrdenar" 
                        class="flex items-center px-4 py-2.5 border rounded-xl transition-colors"
                        :class="ordenarPor ? 'bg-primary-50 border-primary-200 text-primary-700' : 'bg-dark-50 border-dark-200 text-dark-700 hover:bg-dark-100'">
                    <i data-lucide="arrow-up-down" class="w-4 h-4 mr-2"></i>
                    <span x-text="ordenarPor ? 'Orden: ' + ordenarLabels[ordenarPor] : 'Ordenar'"></span>
                    <i data-lucide="chevron-down" class="w-4 h-4 ml-2 text-dark-400"></i>
                </button>
                <div x-show="openOrdenar" @click.away="openOrdenar = false" x-cloak
                     class="absolute top-full left-0 mt-2 w-56 bg-white rounded-xl border border-dark-100 shadow-lg z-20">
                    <div class="p-2">
                        <button @click="setOrdenar(null); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700"
                                :class="{ 'bg-primary-50 text-primary-700': !ordenarPor }">
                            Por defecto
                        </button>
                        <button @click="setOrdenar('nombre', 'asc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'nombre' && ordenarDir === 'asc' }">
                            <span>Nombre A-Z</span>
                            <i data-lucide="arrow-up" class="w-3 h-3"></i>
                        </button>
                        <button @click="setOrdenar('nombre', 'desc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'nombre' && ordenarDir === 'desc' }">
                            <span>Nombre Z-A</span>
                            <i data-lucide="arrow-down" class="w-3 h-3"></i>
                        </button>
                        <div class="border-t border-dark-100 my-1"></div>
                        <button @click="setOrdenar('star_miles', 'desc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'star_miles' && ordenarDir === 'desc' }">
                            <span>Más millas primero</span>
                            <i data-lucide="arrow-down" class="w-3 h-3"></i>
                        </button>
                        <button @click="setOrdenar('star_miles', 'asc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'star_miles' && ordenarDir === 'asc' }">
                            <span>Menos millas primero</span>
                            <i data-lucide="arrow-up" class="w-3 h-3"></i>
                        </button>
                        <div class="border-t border-dark-100 my-1"></div>
                        <button @click="setOrdenar('fecha_vencimiento', 'asc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'fecha_vencimiento' && ordenarDir === 'asc' }">
                            <span>Vence pronto primero</span>
                            <i data-lucide="arrow-up" class="w-3 h-3"></i>
                        </button>
                        <button @click="setOrdenar('fecha_vencimiento', 'desc'); openOrdenar = false" 
                                class="w-full text-left px-3 py-2 rounded-lg hover:bg-dark-50 text-dark-700 flex items-center justify-between"
                                :class="{ 'bg-primary-50 text-primary-700': ordenarPor === 'fecha_vencimiento' && ordenarDir === 'desc' }">
                            <span>Vence último primero</span>
                            <i data-lucide="arrow-down" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Toggle Vista -->
            <div class="flex items-center bg-dark-100 rounded-xl p-1 ml-auto">
                <button @click="viewMode = 'cards'"
                        :class="viewMode === 'cards' ? 'bg-white shadow-sm text-dark-900' : 'text-dark-500 hover:text-dark-700'"
                        class="flex items-center px-3 py-1.5 rounded-lg text-sm font-medium transition-all"
                        aria-label="Vista cards">
                    <i data-lucide="layout-grid" class="w-4 h-4 mr-1.5"></i>Cards
                </button>
                <button @click="viewMode = 'table'"
                        :class="viewMode === 'table' ? 'bg-white shadow-sm text-dark-900' : 'text-dark-500 hover:text-dark-700'"
                        class="flex items-center px-3 py-1.5 rounded-lg text-sm font-medium transition-all"
                        aria-label="Vista tabla">
                    <i data-lucide="list" class="w-4 h-4 mr-1.5"></i>Tabla
                </button>
            </div>
        </div>
    </div>

    <!-- Contenedor de ambas vistas (target HTMX) -->
    <div id="desafios-content">
        {% include "starmiles/partials/desafios_content.html" %}
    </div>
</div>

<!-- Modal Inscribirse -->
<div id="modal-inscribir" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm" onclick="cerrarModalInscribir()"></div>
    <div class="bg-white rounded-2xl shadow-soft p-6 z-10 max-w-md w-full relative">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="target" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h3 class="text-xl font-bold text-dark-900 mb-2">Inscribirse al desafío</h3>
            <p class="text-dark-500" id="modal-desafio-nombre"></p>
        </div>
        <form id="form-inscribir" hx-post="" hx-target="#inscripcion-result" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-dark-700 mb-2">Comentario (opcional)</label>
                <textarea name="comentario" rows="3" placeholder="¿Por qué querés participar?"
                          class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500"></textarea>
            </div>
            <div id="inscripcion-result" class="mb-4"></div>
            <div class="flex space-x-3">
                <button type="button" onclick="cerrarModalInscribir()" class="flex-1 px-5 py-2.5 border border-dark-200 text-dark-700 rounded-xl hover:bg-dark-50">Cancelar</button>
                <button type="submit" class="flex-1 px-5 py-2.5 bg-primary-500 text-white rounded-xl hover:bg-primary-600">Inscribirme</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function abrirModalInscribir(desafioId, desafioNombre) {
    document.getElementById('modal-desafio-nombre').textContent = desafioNombre;
    document.getElementById('form-inscribir').setAttribute('hx-post', '/starmiles/desafios/' + desafioId + '/inscribir');
    htmx.process(document.getElementById('form-inscribir'));
    document.getElementById('inscripcion-result').innerHTML = '';
    document.getElementById('form-inscribir').reset();
    document.getElementById('modal-inscribir').classList.remove('hidden');
    document.getElementById('modal-inscribir').classList.add('flex');
}

function cerrarModalInscribir() {
    document.getElementById('modal-inscribir').classList.add('hidden');
    document.getElementById('modal-inscribir').classList.remove('flex');
}

function desafiosFiltros() {
    return {
        viewMode: localStorage.getItem('starmiles_desafios_viewMode') || 'cards',
        buscar: '',
        categoriaId: '',
        alcance: '',
        ordenarPor: '',
        ordenarDir: 'asc',
        paginaActual: 1,
        ordenarLabels: {
            'nombre': 'Nombre',
            'star_miles': 'Millas',
            'fecha_vencimiento': 'Vencimiento'
        },

        setOrdenar(campo, dir) {
            if (campo === null) {
                this.ordenarPor = '';
                this.ordenarDir = 'asc';
            } else {
                this.ordenarPor = campo;
                this.ordenarDir = dir || 'asc';
            }
            this.paginaActual = 1;
            this.aplicarFiltros();
        },

        irAPagina(pagina) {
            this.paginaActual = pagina;
            this.aplicarFiltros();
        },

        aplicarFiltros() {
            const params = new URLSearchParams();
            params.append('pagina', this.paginaActual);
            if (this.buscar) params.append('search', this.buscar);
            if (this.categoriaId) params.append('categoria_id', this.categoriaId);
            if (this.alcance) params.append('alcance', this.alcance);
            if (this.ordenarPor) {
                params.append('ordenar_por', this.ordenarPor);
                params.append('ordenar_dir', this.ordenarDir);
            }

            htmx.ajax('GET', '{{ url_for("starmiles.desafios_list") }}?' + params.toString(), {
                target: '#desafios-content',
            });
        }
    }
}
</script>
{% endblock %}
