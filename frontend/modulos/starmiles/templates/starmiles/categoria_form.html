{% extends "core/base.html" %}

{% block title %}{{ 'Editar' if categoria else 'Nueva' }} Categoría - Star Miles{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto animate-fade-in">
    <!-- Header -->
    <div class="flex items-center mb-6">
        <a href="{{ url_for('starmiles.admin_categorias') }}" class="p-2 rounded-xl hover:bg-dark-100 mr-3 text-dark-500">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-dark-900">{{ 'Editar' if categoria else 'Nueva' }} Categoría</h1>
            <p class="text-dark-500 text-sm">{{ 'Modifica la información' if categoria else 'Completa el formulario' }}</p>
        </div>
    </div>
    
    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="form-error"></div>
        
        <form hx-post="{{ url_for('starmiles.admin_categoria_editar', id=categoria.id) if categoria else url_for('starmiles.admin_categoria_crear') }}" 
              hx-target="#form-error" method="POST">
            
            <div class="p-8 space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Nombre *</label>
                    <input type="text" name="nombre" value="{{ categoria.nombre if categoria else '' }}" required
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-2">Descripción</label>
                    <input type="text" name="descripcion" value="{{ categoria.descripcion if categoria else '' }}"
                           class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Color</label>
                        <input type="color" name="color" value="{{ categoria.color if categoria else '#3B82F6' }}"
                               class="w-full h-12 rounded-xl border border-dark-200 cursor-pointer">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-dark-700 mb-2">Icono (Lucide)</label>
                        <input type="text" name="icono" value="{{ categoria.icono if categoria else 'star' }}" placeholder="star, target, trophy..."
                               class="w-full px-4 py-3 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="px-8 py-5 bg-dark-50 border-t border-dark-100 flex items-center justify-between">
                <a href="{{ url_for('starmiles.admin_categorias') }}" class="text-dark-500 hover:text-dark-700 font-medium">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 shadow-soft font-semibold flex items-center">
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i>
                    {{ 'Guardar' if categoria else 'Crear' }}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
