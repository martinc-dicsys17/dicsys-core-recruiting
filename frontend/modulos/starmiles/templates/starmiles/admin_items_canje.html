{% extends "core/base.html" %}

{% block title %}Gestionar Canjes - Star Miles{% endblock %}

{% block content %}
<div class="animate-fade-in" x-data="{ showDeleteModal: false, deleteId: null }">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <div>
            <h1 class="text-3xl font-bold text-dark-900 mb-1">🎁 Gestionar Canjes</h1>
            <p class="text-dark-500">ABM de premios canjeables</p>
        </div>
        <a href="{{ url_for('starmiles.admin_item_crear') }}" class="mt-4 md:mt-0 flex items-center px-4 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all shadow-soft font-medium">
            <i data-lucide="plus" class="w-4 h-4 mr-2"></i>Nuevo Item
        </a>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="items-table" hx-get="{{ url_for('starmiles.admin_items_canje') }}" hx-trigger="itemDeleted from:body">
            {% include "starmiles/partials/admin_items_table.html" %}
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div x-show="showDeleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm" @click="showDeleteModal = false"></div>
        <div class="bg-white rounded-2xl shadow-soft p-6 z-10 max-w-md w-full">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
                </div>
                <h3 class="text-xl font-bold text-dark-900 mb-2">¿Eliminar item?</h3>
                <p class="text-dark-500 mb-6">Esta acción no se puede deshacer.</p>
            </div>
            <div class="flex space-x-3">
                <button @click="showDeleteModal = false" class="flex-1 px-5 py-2.5 border border-dark-200 text-dark-700 rounded-xl hover:bg-dark-50">Cancelar</button>
                <button @click="htmx.ajax('DELETE', '/starmiles/admin/items-canje/' + deleteId + '/eliminar', {target: '#items-table'}); showDeleteModal = false" class="flex-1 px-5 py-2.5 bg-red-500 text-white rounded-xl hover:bg-red-600">Eliminar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
