{% extends "core/base.html" %}

{% block title %}Actualización de Datos - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Actualización de Datos</h1>
            <p class="text-gray-500 mt-1">Procesos de sincronización con sistemas externos</p>
        </div>
    </div>

    <!-- Tabla de procesos -->
    <div id="procesos-container">
        {% include 'sincronizacion/partials/table.html' %}
    </div>
</div>

<!-- Modal para logs -->
<div id="logs-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" 
     onclick="if(event.target === this) this.classList.add('hidden')">
    <div class="bg-white rounded-2xl shadow-xl max-w-4xl w-full mx-4 max-h-[80vh] overflow-hidden">
        <div id="logs-content"></div>
    </div>
</div>

<script>
function mostrarLogs(id) {
    const modal = document.getElementById('logs-modal');
    const content = document.getElementById('logs-content');
    
    content.innerHTML = '<div class="p-8 text-center"><div class="animate-spin w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full mx-auto"></div><p class="mt-4 text-gray-500">Cargando logs...</p></div>';
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    
    fetch(`/configuracion/sincronizacion/${id}/logs`, {
        headers: { 'HX-Request': 'true' }
    })
    .then(r => r.text())
    .then(html => content.innerHTML = html)
    .catch(() => content.innerHTML = '<div class="p-8 text-center text-red-500">Error al cargar logs</div>');
}

function cerrarModal() {
    document.getElementById('logs-modal').classList.add('hidden');
    document.getElementById('logs-modal').classList.remove('flex');
}
</script>
{% endblock %}
