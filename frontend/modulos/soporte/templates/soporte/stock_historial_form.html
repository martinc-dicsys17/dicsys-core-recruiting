{% extends "core/base.html" %}

{% block title %}Historial de Activo - {{ item.nombre }} | Centro IT{% endblock %}

{% block content %}
<div
    class="animate-fade-in bg-[#f8f9fa] min-h-screen p-6 rounded-2xl border border-dark-100 flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-soft border border-dark-100 w-full max-w-2xl overflow-hidden flex flex-col">
        <!-- Reutilizamos el contenido del modal pero en vista de página completa -->
        <div x-data="{ 
            showHistorialModal: true, 
            activoId: '{{ item.id }}', 
            activoNombre: '{{ item.nombre|e }}',
            form_aud: { tipo_evento: 'Mantenimiento Preventivo' }
        }">
            {% include 'soporte/partials/modal_historial.html' %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
</script>
{% endblock %}
