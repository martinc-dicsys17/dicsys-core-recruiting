<!-- Modal Reparacion -->
<div x-show="showReparacionModal" x-cloak
    class="fixed inset-0 z-[100] flex items-center justify-center p-4 overflow-y-auto w-full h-full">
    <div class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm" @click="showReparacionModal = false"
        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"></div>

    <div class="bg-white rounded-2xl shadow-soft z-10 w-full max-w-4xl p-0 my-8 flex flex-col max-h-[90vh]"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100">

        <div class="px-6 py-4 border-b border-dark-100 flex items-center justify-between bg-[#fef9f9]">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center mr-3">
                    <i data-lucide="wrench" class="w-5 h-5 text-[#d32f2f]"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-dark-900 tracking-tight">Reparación de Equipo</h3>
                    <p class="text-xs text-dark-500" x-text="'Registrando reparación en: ' + activoNombre"></p>
                </div>
            </div>
            <button type="button" @click="showReparacionModal = false"
                class="p-2 bg-white border border-dark-200 rounded-xl text-dark-400 hover:text-dark-700 hover:bg-dark-50 transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form :action="'{{ url_for('soporte.stock_historial', item_id='__ID__') }}'.replace('__ID__', activoId)"
            method="POST" enctype="multipart/form-data" class="p-6 flex-1 overflow-y-auto">

            <!-- Evento Oculto -->
            <input type="hidden" name="tipo_evento" value="Reparacion">

            <!-- Bloque principal de Reparación -->
            <div class="space-y-6 mb-6">

                <div>
                    <label class="block text-sm font-semibold text-dark-700 mb-1">Detalle del Problema y Reparación Realizada</label>
                    <textarea name="trabajo_realizado" rows="3" required
                        placeholder="Describa la falla principal y qué acciones o reparaciones hizo el soporte..."
                        class="w-full px-4 py-2.5 bg-white border border-dark-200 rounded-xl focus:ring-2 focus:ring-[#d32f2f] transition-all text-sm resize-none"></textarea>
                </div>

                <div class="p-4 bg-red-50/40 rounded-xl border border-red-100">
                    <div>
                        <label class="block text-sm font-bold text-dark-700 mb-1">Costo de la Reparación ($)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-dark-500 font-medium">$</span>
                            <input type="number" step="0.01" name="costo_reparacion" placeholder="0.00"
                                class="w-full pl-8 pr-4 py-2.5 bg-white border border-dark-200 rounded-xl focus:ring-2 focus:ring-[#d32f2f] transition-all text-sm">
                        </div>
                        <p class="text-xs text-dark-500 mt-1">Incluye mano de obra, insumos y cualquier componente utilizado</p>
                    </div>
                </div>
            </div>

            <!-- Evidencias -->
            <h4 class="font-bold text-dark-800 mb-3 border-b border-dark-100 pb-2">Evidencias Fotográficas (Recomendables)</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-6">
                <div x-data="{ preview: null }">
                    <label class="block text-xs font-semibold text-dark-700 mb-1">📷 Foto de la Reparación/Falla 1</label>
                    <input type="file" name="foto_superior" accept="image/*"
                        @change="preview = $event.target.files[0] ? URL.createObjectURL($event.target.files[0]) : null"
                        class="block w-full text-xs text-dark-500 file:block file:w-full file:py-1.5 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer mb-2">
                    <template x-if="preview">
                        <img :src="preview" class="w-full h-24 rounded-lg border border-dark-200 object-cover">
                    </template>
                </div>
                <div x-data="{ preview: null }">
                    <label class="block text-xs font-semibold text-dark-700 mb-1">📷 Foto Adicional 2</label>
                    <input type="file" name="foto_adicional_1" accept="image/*"
                        @change="preview = $event.target.files[0] ? URL.createObjectURL($event.target.files[0]) : null"
                        class="block w-full text-xs text-dark-500 file:block file:w-full file:py-1.5 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer mb-2">
                    <template x-if="preview">
                        <img :src="preview" class="w-full h-24 rounded-lg border border-dark-200 object-cover">
                    </template>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex space-x-3 pt-4 border-t border-dark-100 justify-end">
                <button type="submit"
                    class="px-5 py-2.5 bg-gradient-to-r from-[#d32f2f] to-red-600 text-white rounded-xl hover:from-red-600 hover:to-red-700 transition-all shadow-soft font-medium">
                    <i data-lucide="wrench" class="w-4 h-4 inline mr-1"></i>
                    <span>Registrar Reparación y Cerrar</span>
                </button>
            </div>
        </form>
    </div>
</div>
