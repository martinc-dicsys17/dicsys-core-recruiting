{% extends "core/base.html" %}

{% block title %}Carreras - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="animate-fade-in" x-data="{ showDeleteModal: false, deleteId: null, deleteNombre: '' }">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <div>
            <h1 class="text-3xl font-bold text-dark-900 mb-1">Carreras</h1>
            <p class="text-dark-500">Gestión de carreras académicas</p>
        </div>
        <a href="{{ url_for('nomina.carreras_create') }}" class="flex items-center px-4 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all shadow-soft font-medium mt-4 md:mt-0">
            <i data-lucide="plus" class="w-4 h-4 mr-2"></i>Nueva Carrera
        </a>
    </div>
    
    <!-- Filtros -->
    <div class="bg-white rounded-2xl border border-dark-100 p-4 mb-6">
        <div class="flex flex-col lg:flex-row lg:items-center gap-4">
            <div class="relative flex-1 max-w-md">
                <i data-lucide="search" class="w-5 h-5 text-dark-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                <input type="text" placeholder="Buscar por nombre..." name="buscar"
                       hx-get="{{ url_for('nomina.carreras_list') }}" 
                       hx-trigger="keyup changed delay:300ms" 
                       hx-target="#carreras-table"
                       hx-include="[name='buscar']"
                       class="w-full pl-12 pr-4 py-2.5 bg-dark-50 border border-dark-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all">
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-2xl border border-dark-100 overflow-hidden">
        <div id="carreras-table" hx-get="{{ url_for('nomina.carreras_list') }}" hx-trigger="carreraDeleted from:body">
            {% include "nomina/partials/carreras_table.html" %}
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div x-show="showDeleteModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm" @click="showDeleteModal = false"></div>
        <div class="bg-white rounded-2xl shadow-soft p-6 z-10 max-w-md w-full">
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
                </div>
                <h3 class="text-xl font-bold text-dark-900 mb-2">¿Eliminar carrera?</h3>
                <p class="text-dark-500 mb-2">Estás por eliminar:</p>
                <p class="text-dark-800 font-semibold mb-6" x-text="deleteNombre"></p>
            </div>
            <div class="flex space-x-3">
                <button @click="showDeleteModal = false" class="flex-1 px-5 py-2.5 border border-dark-200 text-dark-700 rounded-xl hover:bg-dark-50 transition-colors">Cancelar</button>
                <button @click="htmx.ajax('DELETE', '/nomina/carreras/' + deleteId + '/eliminar', {target: '#carreras-table'}); showDeleteModal = false" class="flex-1 px-5 py-2.5 bg-red-500 text-white rounded-xl hover:bg-red-600 transition-colors">Eliminar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
