<div id="notificaciones-bandeja" class="w-96 max-w-[calc(100vw-2rem)] bg-white border border-dark-200 shadow-soft rounded-lg overflow-hidden">
    <div class="px-4 py-3 border-b border-dark-100 flex items-center justify-between gap-3">
        <h2 class="text-sm font-bold text-dark-900">Notificaciones</h2>
        <div class="flex items-center gap-3">
            {% if total_no_leidas %}
            <button type="button"
                    hx-post="{{ url_for('core.leer_todas_notificaciones') }}"
                    hx-target="#notificaciones-bandeja"
                    hx-swap="outerHTML"
                    class="text-xs font-semibold text-primary-600 hover:text-primary-700">
                Marcar todas leidas
            </button>
            {% endif %}
            <a href="{{ url_for('core.historial_notificaciones') }}" class="text-xs font-semibold text-dark-600 hover:text-primary-700">
                Ver historial
            </a>
        </div>
    </div>

    <div class="max-h-96 overflow-y-auto">
        {% for notificacion in items %}
        <div class="group flex gap-2 px-4 py-3 border-b border-dark-100 {{ 'bg-primary-50/60' if notificacion.leida_at else 'bg-white' }}">
            <button type="button"
                    data-read-url="{{ url_for('core.leer_notificacion', notificacion_id=notificacion.id) }}"
                    data-link="{{ notificacion.enlace or '' }}"
                    onclick="leerNotificacionInterna(this)"
                    class="min-w-0 flex-1 text-left hover:opacity-80">
                <div class="flex gap-3">
                    <div class="mt-0.5 w-8 h-8 shrink-0 rounded-lg flex items-center justify-center
                        {% if notificacion.tipo == 'warning' %}bg-amber-100 text-amber-700
                        {% elif notificacion.tipo == 'error' %}bg-red-100 text-red-700
                        {% elif notificacion.tipo == 'success' %}bg-emerald-100 text-emerald-700
                        {% else %}bg-primary-100 text-primary-700{% endif %}">
                        <i data-lucide="{% if notificacion.tipo == 'warning' %}triangle-alert{% elif notificacion.tipo == 'error' %}circle-x{% elif notificacion.tipo == 'success' %}circle-check{% else %}info{% endif %}" class="w-4 h-4"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-2">
                            <p class="text-sm text-dark-900 {{ 'font-bold' if notificacion.leida_at else 'font-medium' }}">{{ notificacion.titulo }}</p>
                            {% if not notificacion.leida_at %}
                            <span class="mt-1.5 w-2 h-2 shrink-0 bg-primary-500 rounded-full"></span>
                            {% endif %}
                        </div>
                        <p class="mt-0.5 text-xs text-dark-600 leading-5">{{ notificacion.mensaje }}</p>
                        <p class="mt-1 text-[11px] text-dark-400">{{ notificacion.created_at|datetime_gmt3_ampm }}</p>
                    </div>
                </div>
            </button>
            <div class="shrink-0 flex flex-col gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                {% if not notificacion.leida_at %}
                <button type="button"
                        data-read-url="{{ url_for('core.leer_notificacion', notificacion_id=notificacion.id) }}"
                        onclick="marcarNotificacionInterna(this)"
                        class="p-1.5 text-dark-400 hover:text-primary-700 hover:bg-primary-50 rounded-lg"
                        title="Marcar como leida" aria-label="Marcar como leida">
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                {% endif %}
                <button type="button"
                        data-delete-url="{{ url_for('core.eliminar_notificacion', notificacion_id=notificacion.id) }}"
                        onclick="eliminarNotificacionInterna(this)"
                        class="p-1.5 text-dark-400 hover:text-red-700 hover:bg-red-50 rounded-lg"
                        title="Eliminar notificacion" aria-label="Eliminar notificacion">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
        {% else %}
        <div class="px-6 py-10 text-center">
            <i data-lucide="bell-off" class="w-7 h-7 mx-auto text-dark-300"></i>
            <p class="mt-3 text-sm font-semibold text-dark-700">No tenes notificaciones</p>
        </div>
        {% endfor %}
    </div>
</div>
