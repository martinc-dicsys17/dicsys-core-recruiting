{% extends "core/base.html" %}

{% block title %}Acceso Denegado - {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh] animate-fade-in">
    <div class="text-center max-w-md">
        <div class="w-24 h-24 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <i data-lucide="shield-x" class="w-12 h-12 text-red-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-dark-900 mb-3">Acceso Denegado</h1>
        <p class="text-dark-500 mb-8">No tenés permisos para acceder a este módulo. Contactá al administrador si creés que es un error.</p>
        <a href="{{ url_for('core.dashboard') }}" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all shadow-soft font-medium">
            <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
            Volver al Dashboard
        </a>
    </div>
</div>
{% endblock %}
