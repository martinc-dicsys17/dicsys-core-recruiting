[pytest]
testpaths =
    backend/tests
    frontend/tests
addopts = -ra --strict-markers --strict-config
markers =
    smoke: verifies that the application starts and exposes essential routes
    integration: exercises real application behavior with PostgreSQL
    services: exercises business services through their public interface
    frontend: exercises Flask routes, sessions, and backend contracts
    deploy_gate: belongs to the canonical promotion suite
