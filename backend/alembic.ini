# Migraciones del esquema con Alembic (F04). Cómo crear, aplicar y revertir revisiones: docs/Migraciones.md.
#
# En la imagen del backend ALEMBIC_CONFIG apunta a este archivo, así que `alembic upgrade head` anda tal cual. Desde
# la raíz del repo: `alembic -c backend/alembic.ini ...`. La base es la de la app (DATABASE_URL), no se configura acá.

[alembic]
script_location = %(here)s/migraciones
# La carpeta que contiene el paquete backend (la raíz del repo, /app en la imagen): env.py importa los modelos
prepend_sys_path = %(here)s/..
path_separator = os
# Revisiones numeradas en orden: 0001_baseline.py, 0002_....py. El número lo asigna env.py, que corre también en
# `alembic revision` sin --autogenerate gracias a revision_environment
file_template = %%(rev)s_%%(slug)s
revision_environment = true
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
