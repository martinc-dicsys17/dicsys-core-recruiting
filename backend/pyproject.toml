[project]
name = "dicsys-core-backend"
version = "0.0.0"
description = "API FastAPI de Dicsys Core"
requires-python = ">=3.14"
dependencies = [
    # Framework principal
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Base de datos y ORM: 2.1 cambia el driver por defecto de postgresql:// a psycopg v3; acá se usa psycopg2
    "sqlalchemy==2.0.54",
    "psycopg2-binary==2.9.13",
    # Migraciones del esquema (F04): se corren como paso de release, nunca en el arranque del backend
    "alembic>=1.19,<2",
    # Validación y serialización
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Autenticación y seguridad: PyJWT reemplaza a python-jose, que arrastraba ecdsa (CVE-2024-23342 sin fix). El extra
    # crypto es para el RS256 de los id_token del proveedor OpenID Connect (F21) y la verificación de los de Google (F22)
    "PyJWT[crypto]>=2.15.1,<3",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    # Cliente HTTP (MercadoLibre y otras integraciones)
    "httpx>=0.25.0",
    # Raíces TLS: 2026.10.19 saca la raíz emSign de eMudhra (claves comprometidas, octubre 2026)
    "certifi>=2026.10.19",
    # Email
    "sendgrid>=6.10.0",
    # Imágenes, PDF (miniaturas con PyMuPDF) y Excel de proveedores
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "openpyxl>=3.1.0",
    # Carga de CV de Recruiting: Word (.docx), comprimidos .rar y OCR de respaldo para las páginas escaneadas de un PDF
    # (rapidocr con los modelos PP-OCRv6; el de reconocimiento se descarga al construir la imagen, ver el Dockerfile).
    # Versiones fijas: los modelos y su SHA256 dependen de la versión de rapidocr.
    "python-docx>=1.1.0",
    "rarfile>=4.1",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    # Google Cloud Storage
    "google-cloud-storage>=2.14.0",
    # 2FA (TOTP)
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4",
    # LLM (Google Gemini)
    "google-genai>=1.0.0",
    "scalar-fastapi>=1.9.1,<2",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Starlette >= 0.50 deprecó httpx como transporte del TestClient
    "httpx2>=2.0.0",
]

[tool.uv]
# Aplicación, no paquete: uv sync instala las dependencias sin instalar el proyecto
package = false
